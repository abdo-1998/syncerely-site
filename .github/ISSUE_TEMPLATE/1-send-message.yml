name: Send a message to the app
description: Shows a message on every user's Home (within a day). Only the repo owner's issues are used.
title: "Message: "
labels: ["send-message"]
body:
  - type: input
    id: title
    attributes:
      label: Title
      description: The bold first line.
      placeholder: Google Drive is slow today
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: Text
      description: One or two sentences.
      placeholder: Google says uploads may take longer until tonight. Nothing is lost; syncs carry on.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: How important
      description: Critical shows in the warning colour, also sends one notification, and has no close button.
      options:
        - Normal
        - Critical
      default: 0
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link (optional)
      description: A page to open. A Play Store link makes the button say Update. Write "play" for the Play Store listing.
  - type: input
    id: expires
    attributes:
      label: Last day it shows (optional)
      description: As yyyy-mm-dd, e.g. 2026-12-02. Empty means until you remove it.
  - type: input
    id: versions
    attributes:
      label: Only these app versions (optional)
      description: Version codes, like "20-24", "-24" (up to 24) or "25-" (25 and later). Empty means every version.
