name: Messages

# A "Send a message" or "Remove a message" issue changes messages.json, comments, and closes itself.
# Only issues opened by the repo owner are used: anyone can open an issue on a public repo.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: messages
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (contains(github.event.issue.labels.*.name, 'send-message') ||
       contains(github.event.issue.labels.*.name, 'remove-message'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change messages.json
        id: change
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ACTION: ${{ contains(github.event.issue.labels.*.name, 'remove-message') && 'remove' || 'send' }}
        run: |
          set +e
          result=$(python3 .github/scripts/messages.py)
          code=$?
          echo "$result" > result.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: steps.change.outputs.code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898313+github-actions[bot]@users.noreply.github.com"
          git add messages.json
          git commit -m "Messages: from issue #${{ github.event.issue.number }}"
          git push
      - name: Answer and close
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          OK: ${{ steps.change.outputs.code == '0' }}
        run: |
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file result.txt
          if [ "$OK" = "true" ]; then
            gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
          else
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "Nothing changed. Fix it by opening a new issue."
            gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason "not planned"
          fi
